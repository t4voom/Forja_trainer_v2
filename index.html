<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="FORJA Trainer — gestão de alunos e treinos para academias.">
  <title>FORJA Trainer</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">

  <!-- Tema antes da primeira pintura (preferência local, não é dado de negócio) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('forja.trainer.theme') || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <!-- ?v=... força o navegador a baixar a versão nova depois de cada atualização. Mude o número ao publicar. -->
  <link rel="stylesheet" href="css/trainer.css?v=1">
</head>
<body>
  <div id="root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/config.js?v=1"></script>

  <!-- Compartilhados com o app FORJA: utilitários/ícones e a biblioteca de exercícios -->
  <script src="js/shared/utils.js?v=1"></script>
  <script src="js/shared/store.js?v=1"></script>
  <script src="js/shared/exercises.js?v=1"></script>

  <script src="js/api.js?v=1"></script>
  <script src="js/ui.js?v=1"></script>
  <script src="js/views.js?v=1"></script>
  <script src="js/editor.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
</body>
</html>
